<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Insta Class Viewer</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    margin: 0;
}

.container {
    margin-top: 80px;
}

input {
    padding: 12px;
    margin: 10px;
    border-radius: 8px;
    border: none;
    width: 250px;
}

button {
    padding: 12px 20px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    background: #00ffd5;
    color: black;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #00c9a7;
}

.hidden {
    display: none;
}

.class-btn {
    display: block;
    margin: 10px auto;
    width: 220px;
}

#dataBox p {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    margin: 8px auto;
    width: 200px;
    border-radius: 8px;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="container" id="loginPage">
    <h2>Enter Your Details</h2>
    <input type="text" id="name" placeholder="Enter your name"><br>
    <input type="text" id="insta" placeholder="Enter your Insta ID"><br>
    <button onclick="submitForm()">Submit</button>
</div>

<!-- CLASS PAGE -->
<div class="container hidden" id="classPage">
    <h2>Select Your Class</h2>

    <button class="class-btn" onclick="showData(8)">Class 8</button>
    <button class="class-btn" onclick="showData(9)">Class 9</button>
    <button class="class-btn" onclick="showData(10)">Class 10</button>
    <button class="class-btn" onclick="showData(11)">Class 11</button>
    <button class="class-btn" onclick="showData(12)">Class 12</button>

</div>

<!-- DATA PAGE -->
<div class="container hidden" id="dataPage">
    <h2>Students Insta IDs</h2>
    <div id="dataBox"></div>
    <button onclick="goBack()">⬅ Back</button>
</div>

<script>

// 🔥 DATA (Tu yaha apni IDs add kar sakta hai)
const classData = {
    8: ["@class8_user1", "@class8_user2"],
    9: ["@class9_user1"],
    10: ["@class10_user1"],
    11: ["@class11_user1"],
    12: ["@mehull_sharma27"] // 👈 TERI ID DAL DI
};

function submitForm() {
    let name = document.getElementById("name").value;
    let insta = document.getElementById("insta").value;

    if (name === "" || insta === "") {
        alert("Please fill all fields!");
        return;
    }

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("classPage").classList.remove("hidden");
}

function showData(classNum) {
    let data = classData[classNum];

    let output = "";
    data.forEach(id => {
        output += `<p>${id}</p>`;
    });

    document.getElementById("classPage").classList.add("hidden");
    document.getElementById("dataPage").classList.remove("hidden");
    document.getElementById("dataBox").innerHTML = output;
}

function goBack() {
    document.getElementById("dataPage").classList.add("hidden");
    document.getElementById("classPage").classList.remove("hidden");
}

</script>

</body>
</html>
